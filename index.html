<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estúdio ABC — Portal do Lojista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap" />
    <meta name="theme-color" content="#FAF9F6" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Figtree, system-ui, -apple-system, sans-serif; background: #FAF9F6; color: #17150F; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; }
      button, input, select, textarea { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid #8F6D37; outline-offset: 2px; }
      input:focus, select:focus, textarea:focus { border-color: #17150F !important; }
      ::selection { background: #E9DFCC; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
